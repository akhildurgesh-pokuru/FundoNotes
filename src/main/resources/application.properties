
spring.application.name=fundoo-notes
server.port=8080

# MySQL database configuration
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/fundoo_notes
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration
jwt.secret.key=${JWT_SECRET}
jwt.expiration.ms=86400000

# Local Mailpit SMTP configuration
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Application URL
app.base-url=http://localhost:8080

# Token expiration configuration
app.verification.expiration-minutes=1440
app.password-reset.expiration-minutes=15

# Logging
logging.level.com.fundoonotes=INFO

# Check due reminders every 10 seconds.
app.reminder.check-delay-ms=10000

# Sender address displayed by Mailpit.
app.reminder.mail.from=no-reply@fundoonotes.local



# ===============================
# UC11: REDIS CACHE CONFIGURATION
# ===============================

# Local Redis instance.
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Enable Redis as the Spring Cache provider.
spring.cache.type=redis

# Create the userLabels cache.
spring.cache.cache-names=userLabels

# Cache entries automatically expire after 5 minutes.
spring.cache.redis.time-to-live=5m

# Keep prefixes so different caches don't share keys.
spring.cache.redis.use-key-prefix=true


# UC12: RabbitMQ local connection
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Use one consumer for our beginner implementation.
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1

# Avoid endlessly requeuing a failed email delivery.
# The scheduler can publish the unsent reminder again later.
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Reminder scheduler checks every 10 seconds for testing.
# Change to 60000 for a 60-second interval.


# ===============================
# UC13: AOP MONITORING
# ===============================

# Show AOP application logs.
logging.level.com.fundoonotes.aop=INFO

# Enable Spring AOP proxy support.
spring.aop.auto=true

# Use class-based proxies for application services.
spring.aop.proxy-target-class=true


# ==============================
# UC14: SPRING BATCH
# ==============================

# We launch imports through a REST API,
# not automatically at application startup.
spring.batch.job.enabled=false

# Create Spring Batch metadata tables in MySQL.
# For this development setup, Spring Boot initializes
# the Batch schema when needed.
spring.batch.jdbc.initialize-schema=always

# Limit uploaded CSV file sizes.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB




