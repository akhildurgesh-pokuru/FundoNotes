spring.application.name=fundoo-notes


# Base64-encoded signing key supplied through an environment variable.
jwt.secret.key=${JWT_SECRET}

# JWT lifetime: 24 hours, in milliseconds.
jwt.expiration.ms=86400000


spring.datasource.url=jdbc:mysql://localhost:3306/fundoo_notes
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.com.fundoonotes=INFO

server.port=8080

