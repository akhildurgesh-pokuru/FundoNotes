
spring.application.name=fundoo-notes
server.port=8080

# MySQL database configuration
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/fundoo_notes
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration
jwt.secret.key=${JWT_SECRET}
jwt.expiration.ms=86400000

# Local Mailpit SMTP configuration
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Application URL
app.base-url=http://localhost:8080

# Token expiration configuration
app.verification.expiration-minutes=1440
app.password-reset.expiration-minutes=15

# Logging
logging.level.com.fundoonotes=INFO

# Check due reminders every 10 seconds.
app.reminder.check-delay-ms=10000

# Sender address displayed by Mailpit.
app.reminder.mail.from=no-reply@fundoonotes.local
