# ==================================
# UC17: FUNDOO API GATEWAY
# ==================================

spring.application.name=fundoo-api-gateway

# Gateway listens on a different port.
server.port=8081

# Address of the existing Fundoo Notes backend.
fundoo.backend.url=http://localhost:8080

# Gateway logs for learning and debugging.
logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.fundoonotes.gateway=INFO

# Expose a health-check endpoint.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
